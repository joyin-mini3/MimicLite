[project]
name = "mimiclite-runtime"
version = "0.1.0"
description = "Unified Python 3.12 runtime for MimicLite training and local sim2real"
requires-python = "==3.12.*"
dependencies = [
    "active-adaptation[mjlab]",
    "mimic-lite",
    "hdmi-sim2real",
]

[tool.uv.sources]
active-adaptation = { path = "../active-adaptation", editable = true }
mimic-lite = { path = "../mimic-lite", editable = true }
hdmi-sim2real = { path = "../sim2real", editable = true }
any4hdmi = { path = "../any4hdmi", editable = true }

[tool.uv]
package = false
